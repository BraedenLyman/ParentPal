name: Mirror to Mohawk Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  

      - name: Push to mirror repo
        run: |
          git remote add mirror https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/Steve-at-Mohawk-College/capstone-project-BraedenLyman.git
          git push --force --mirror mirror
