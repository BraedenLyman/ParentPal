name: OWASP ZAP Security Scan

on:
  push:
    branches: [ main, develop ]

  pull_request:
    branches: [ main, develop ]

  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - full
          - api

  schedule:
    - cron: '0 2 * * 1'

jobs:
  security-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build application
        run: npm run build

      - name: Create reports directory
        run: mkdir -p zap-reports

      - name: Start application services
        run: |
          # Start backend
          cd backend
          npm start &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          cd ..

          # Start frontend
          npm run preview &
          FRONTEND_PID=$!
          echo "FRONTEND_PID=$FRONTEND_PID" >> $GITHUB_ENV

          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 10

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4173'
          rules_file_name: '.zap/zap-rules.tsv'
          cmd_options: '-a -j -l PASS -m 5'
          fail_action: true
          allow_issue_writing: true

      - name: Upload ZAP Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-results
          path: |
            zap-reports/
            report_html.html
            report_json.json
            report_md.md

      - name: Create ZAP SARIF Report
        if: always()
        run: |
          # Convert ZAP JSON to SARIF format for GitHub Security tab
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            zaproxy/zaproxy:stable \
            python3 -c "
          import json
          import sys

          try:
              with open('/workspace/report_json.json', 'r') as f:
                  zap_data = json.load(f)

              sarif = {
                  'version': '2.1.0',
                  '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
                  'runs': [{
                      'tool': {
                          'driver': {
                              'name': 'OWASP ZAP',
                              'version': '2.14.0',
                              'informationUri': 'https://www.zaproxy.org/'
                          }
                      },
                      'results': []
                  }]
              }

              for site in zap_data.get('site', []):
                  for alert in site.get('alerts', []):
                      sarif['runs'][0]['results'].append({
                          'ruleId': str(alert.get('pluginid', '')),
                          'level': alert.get('riskcode', '0'),
                          'message': {'text': alert.get('alert', '')},
                          'locations': [{
                              'physicalLocation': {
                                  'artifactLocation': {
                                      'uri': alert.get('url', '')
                                  }
                              }
                          }]
                      })

              with open('/workspace/zap-results.sarif', 'w') as f:
                  json.dump(sarif, f, indent=2)
          except Exception as e:
              print(f'Error: {e}')
              sys.exit(0)
          "

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap-results.sarif
          category: security-scan

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🔒 OWASP ZAP Security Scan Results\n\n';

            try {
              const reportMd = fs.readFileSync('report_md.md', 'utf8');
              comment += reportMd;
            } catch (error) {
              comment += '⚠️ Report file not found\n';
            }

            comment += '\n\n📊 Full reports available in workflow artifacts.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Cleanup
        if: always()
        run: |
          # Stop background processes
          [ ! -z "$BACKEND_PID" ] && kill $BACKEND_PID || true
          [ ! -z "$FRONTEND_PID" ] && kill $FRONTEND_PID || true

      - name: Fail build on high-risk findings
        if: failure()
        run: |
          echo "❌ Security scan failed - high-risk vulnerabilities found!"
          echo "Review the scan results and address the issues before merging."
          exit 1
