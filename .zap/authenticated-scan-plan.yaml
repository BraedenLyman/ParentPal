env:
  contexts:
    - name: "ParentPal-Authenticated"
      urls:
        - "http://parentpal-frontend-scan:5173"
        - "http://parentpal-backend-scan:3000"
      includePaths:
        - "http://parentpal-frontend-scan:5173/.*"
        - "http://parentpal-backend-scan:3000/api/.*"
      excludePaths:
        - ".*\\.js$"
        - ".*\\.css$"
        - ".*\\.png$"
        - ".*\\.jpg$"
        - ".*\\.svg$"
        - ".*\\.ico$"
        - ".*\\.woff.*$"
        - ".*/images/.*"
        - ".*/static/.*"

      sessionManagement:
        method: "cookie"

      technology:
        exclude: []

  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

  vars:
    frontend_url: "http://parentpal-frontend-scan:5173"
    backend_url: "http://parentpal-backend-scan:3000"

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true

  - type: spider
    parameters:
      context: "ParentPal-Authenticated"
      url: "http://parentpal-frontend-scan:5173"
      maxDuration: 5
      maxDepth: 5
      maxChildren: 10
      acceptCookies: true
      handleODataParametersVisited: false
      parseComments: true
      parseGit: true
      parseRobotsTxt: true
      parseSitemapXml: true
      parseSVNEntries: true
      postForm: true
      processForm: true
      requestWaitTime: 200
      sendRefererHeader: true
      threadCount: 5

  - type: spiderAjax
    parameters:
      context: "ParentPal-Authenticated"
      url: "http://parentpal-frontend-scan:5173"
      maxDuration: 5
      maxCrawlDepth: 10
      numberOfBrowsers: 1
      browserId: "firefox-headless"
      clickDefaultElems: true
      clickElemsOnce: true
      eventWait: 1000
      maxCrawlStates: 0
      randomInputs: true
      reloadWait: 1000

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: activeScan
    parameters:
      context: "ParentPal-Authenticated"
      policy: "Default Policy"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 10
      addQueryParam: false
      defaultPolicy: "Default Policy"
      delayInMs: 0
      handleAntiCSRFTokens: true
      injectPluginIdInHeader: false
      scanHeadersAllRequests: true
      threadPerHost: 2

  - type: activeScan-wait
    parameters:
      maxDuration: 15

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk"
      reportFile: "authenticated-scan-report"
      reportTitle: "ParentPal Authenticated Security Scan"
      reportDescription: "Comprehensive security scan with authentication"
      displayReport: false

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk"
      reportFile: "authenticated-scan-report"
      reportTitle: "ParentPal Authenticated Security Scan"
      reportDescription: "Comprehensive security scan with authentication"
      displayReport: false

  - type: report
    parameters:
      template: "traditional-md"
      reportDir: "/zap/wrk"
      reportFile: "authenticated-scan-report"
      reportTitle: "ParentPal Authenticated Security Scan"
      reportDescription: "Comprehensive security scan with authentication"
      displayReport: false
