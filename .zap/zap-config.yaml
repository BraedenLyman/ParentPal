app:
  name: "ParentPal"
  url: "http://localhost:5173"
  context: "ParentPal"

authentication:
  type: "form"
  loginUrl: "http://localhost:5173/sign-in"
  loginRequestData: "email={%username%}&password={%password%}"
  usernameField: "email"
  passwordField: "password"
  loggedInIndicator: '\Q/parent-dashboard\E|\Q/babysitter-dashboard\E'
  loggedOutIndicator: '\Qsign-in\E'

session:
  type: "cookie"

users:
  - name: "test-parent"
    credentials:
      username: "parent@test.com"
      password: "Test123!"
  - name: "test-babysitter"
    credentials:
      username: "babysitter@test.com"
      password: "Test123!"

includeUrls:
  - "http://localhost:5173/.*"
  - "http://localhost:3000/api/.*"

excludeUrls:
  - "http://localhost:5173/static/.*"
  - "http://localhost:5173/images/.*"
  - ".*\\.js$"
  - ".*\\.css$"
  - ".*\\.png$"
  - ".*\\.jpg$"
  - ".*\\.jpeg$"
  - ".*\\.gif$"
  - ".*\\.svg$"
  - ".*\\.ico$"
  - ".*\\.woff.*$"
  - ".*\\.ttf$"

apiEndpoints:
  - "http://localhost:3000/api/accounts"
  - "http://localhost:3000/api/sign-in"
  - "http://localhost:3000/api/babies"
  - "http://localhost:3000/api/growth"
  - "http://localhost:3000/api/sleep"
  - "http://localhost:3000/api/health"
  - "http://localhost:3000/api/feeding"
  - "http://localhost:3000/api/observation"
  - "http://localhost:3000/api/tasks"

scanPolicies:
  activeScan:
    enabled: true
    policy: "Default Policy"
    strength: "Medium"
    threshold: "Medium"

  passiveScan:
    enabled: true

  spider:
    enabled: true
    maxDepth: 5
    maxChildren: 10
    maxDuration: 10 

  ajaxSpider:
    enabled: true
    maxDuration: 10 
    maxCrawlDepth: 10

alerts:
  minRiskLevel: "Low"
  ignore:

  customThresholds:
    - id: 40018
      threshold: "Low"
    - id: 40012
      threshold: "Low"
    - id: 40014
      threshold: "Low"
    - id: 10202
      threshold: "Medium"

reporting:
  formats:
    - html
    - json
    - xml
    - markdown
  outputDir: "./zap-reports"

advanced:
  maxScanDuration: 60

  threads:
    spider: 5
    activeScan: 5

  memory: 1024

technologies:
  - React
  - Node.js
  - Express
  - MySQL
  - Firebase

headers:
  - name: "X-ZAP-Scan"
    value: "true"

rateLimit: 10

proxy:
  enabled: false

docker:
  image: "ghcr.io/zaproxy/zaproxy:stable"
  network: "host"

ci:
  failOnRisk:
    high: true
    medium: true
    low: false
    informational: false

  maxAlerts:
    high: 0
    medium: 5
    low: 20
