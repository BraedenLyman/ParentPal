openapi: 3.0.0
info:
  title: ParentPal API
  version: 1.0.0
  description: ParentPal Baby Tracking API

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/test:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server is running

  /api/accounts:
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firebaseUid
                - fName
                - lName
                - email
                - accountType
              properties:
                firebaseUid:
                  type: string
                fName:
                  type: string
                lName:
                  type: string
                email:
                  type: string
                  format: email
                accountType:
                  type: string
                dob:
                  type: string
                  format: date
                gender:
                  type: string
      responses:
        '201':
          description: Account created
        '400':
          description: Missing required fields

  /api/growth:
    get:
      summary: Get growth records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of growth records
        '500':
          description: Server error

    post:
      summary: Create growth record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - date
              properties:
                baby_id:
                  type: integer
                weight:
                  type: number
                height:
                  type: number
                date:
                  type: string
                  format: date
      responses:
        '201':
          description: Growth record created
        '400':
          description: Validation error

  /api/sleep:
    get:
      summary: Get sleep records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of sleep records

    post:
      summary: Create sleep record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - time_fell_asleep
                - date
              properties:
                baby_id:
                  type: integer
                sleep_duration:
                  type: number
                time_fell_asleep:
                  type: string
                date:
                  type: string
                  format: date
      responses:
        '201':
          description: Sleep record created

  /api/feeding:
    get:
      summary: Get feeding records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of feeding records

    post:
      summary: Create feeding record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - time_fed
                - date
                - fed_from
                - type_of_food
              properties:
                baby_id:
                  type: integer
                time_fed:
                  type: string
                date:
                  type: string
                  format: date
                fed_from:
                  type: string
                type_of_food:
                  type: string
                amount:
                  type: number
      responses:
        '201':
          description: Feeding record created

  /api/observation:
    get:
      summary: Get observation records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of observation records

    post:
      summary: Create observation record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - priority_level
              properties:
                baby_id:
                  type: integer
                priority_level:
                  type: string
                  enum: [low, medium, high]
                notes:
                  type: string
      responses:
        '201':
          description: Observation record created

  /api/allergies:
    get:
      summary: Get allergy records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of allergy records

    post:
      summary: Create allergy record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - allergy_name
                - severity
                - epi_pen
              properties:
                baby_id:
                  type: integer
                allergy_name:
                  type: string
                severity:
                  type: string
                epi_pen:
                  type: boolean
      responses:
        '201':
          description: Allergy record created

  /api/meds:
    get:
      summary: Get medication records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of medication records

    post:
      summary: Create medication record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - medication_name
                - time_taken
                - date
                - dosage
                - symptoms
              properties:
                baby_id:
                  type: integer
                medication_name:
                  type: string
                time_taken:
                  type: string
                date:
                  type: string
                  format: date
                dosage:
                  type: string
                symptoms:
                  type: string
      responses:
        '201':
          description: Medication record created

  /api/vaccinations:
    get:
      summary: Get vaccination records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of vaccination records

    post:
      summary: Create vaccination record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - date_of_vaccine
              properties:
                baby_id:
                  type: integer
                vaccination_name:
                  type: string
                date_of_vaccine:
                  type: string
                  format: date
      responses:
        '201':
          description: Vaccination record created

  /api/sickday:
    get:
      summary: Get sick day records
      parameters:
        - name: baby_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of sick day records

    post:
      summary: Create sick day record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - baby_id
                - date
              properties:
                baby_id:
                  type: integer
                date:
                  type: string
                  format: date
                meds_taken:
                  type: string
                temp:
                  type: number
      responses:
        '201':
          description: Sick day record created
